name: Pulso IA — Spec Executor

on:
  push:
    paths:
      - 'specs/pending/**.md'   # Solo se activa con specs en /pending

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  execute-spec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js 22 (para Claude Code CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Detectar spec pusheado
        id: spec
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          else
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$AFTER")
          fi
          SPEC_FILE=$(echo "$CHANGED" | grep '^specs/pending/.*\.md$' | head -1)
          if [ -z "$SPEC_FILE" ]; then
            echo "No se encontró ningún spec nuevo en specs/pending/. Saliendo."
            exit 1
          fi
          echo "file=$SPEC_FILE" >> $GITHUB_OUTPUT
          TICKET_NAME=$(basename "$SPEC_FILE" .md)
          echo "ticket=$TICKET_NAME" >> $GITHUB_OUTPUT
          echo "branch=feature/${TICKET_NAME}-${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT
          echo "Spec detectado: $SPEC_FILE → rama feature/${TICKET_NAME}-${GITHUB_RUN_ID}"

      - name: Crear rama del ticket
        run: |
          git config user.name "Pulso IA Bot"
          git config user.email "bot@pulso-ia"
          git checkout -B ${{ steps.spec.outputs.branch }}

      - name: Instalar dependencias del proyecto (para tests)
        run: |
          pip install pytest pytest-cov
          pip install -r lambdas/fetch_sources/requirements.txt
          pip install -r lambdas/filter_ai_news/requirements.txt
          pip install -r lambdas/publish_telegram/requirements.txt

      - name: Ejecutar spec con Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SPEC_CONTENT=$(cat "${{ steps.spec.outputs.file }}")

          claude -p "
          Sos el agente de desarrollo de Pulso IA, un pipeline serverless en AWS.

          CONTEXTO DEL PROYECTO (CLAUDE.md):
          $(cat CLAUDE.md)

          TAREA — ejecutar el siguiente spec exactamente:

          $SPEC_CONTENT

          REGLAS DE EJECUCIÓN:
          1. Implementá el código descrito en el spec
          2. Escribí o actualizá los tests correspondientes en tests/
          3. Respetá todas las convenciones de CLAUDE.md
          4. No modifiques archivos fuera del scope del spec
          5. No toques infra/ salvo que el spec lo indique explícitamente
          6. Si el spec agrega una fuente nueva, actualizá sources/sources.json también
          " \
          --allowedTools "Read,Write,Edit,Bash,Glob,Grep" \
          --max-turns 30 \
          --dangerously-skip-permissions \
          --output-format text

      - name: Correr tests
        run: |
          export PYTHONPATH="lambdas/fetch_sources:lambdas/filter_ai_news:lambdas/publish_telegram:lambdas/evening_summary:shared:$PYTHONPATH"
          export DYNAMODB_TABLE="test-table"
          export TELEGRAM_CHANNEL_ID="-1000000000000"

          pytest tests/ \
            --cov=lambdas \
            --cov=shared \
            --cov-report=term-missing \
            --tb=short \
            -q 2>&1 | tee /tmp/test-output.txt
        continue-on-error: true

      - name: Mover spec de pending → done
        run: |
          mkdir -p specs/done
          SPEC_FILE="${{ steps.spec.outputs.file }}"
          TICKET_NAME="${{ steps.spec.outputs.ticket }}"
          DONE_FILE="specs/done/${TICKET_NAME}.md"

          # Agregar log de ejecución al spec (sigue tracked en pending hasta el mv)
          echo "" >> "$SPEC_FILE"
          echo "---" >> "$SPEC_FILE"
          echo "## Execution log" >> "$SPEC_FILE"
          echo "- Ejecutado: $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$SPEC_FILE"
          echo "- Rama: feature/$TICKET_NAME" >> "$SPEC_FILE"
          echo "- Runner: $GITHUB_RUN_ID" >> "$SPEC_FILE"

          # `git mv` registra borrado en pending + destino en done; `mv` solo deja dos copias al mergear o en el índice.
          git mv -f "$SPEC_FILE" "$DONE_FILE"

          test ! -f "specs/pending/${TICKET_NAME}.md" \
            || { echo "::error::El spec sigue existiendo en pending tras git mv"; exit 1; }

      - name: Commit del código generado + spec movido
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "feat(${{ steps.spec.outputs.ticket }}): implementación generada por IA

          Spec movido: specs/pending → specs/done
          Generado automáticamente por Claude Code pipeline

          [skip ci]"
          fi

      - name: Push de la rama
        run: |
          git push origin ${{ steps.spec.outputs.branch }}

      - name: Generar descripción del PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SPEC_CONTENT=$(tail -n 200 "specs/done/${{ steps.spec.outputs.ticket }}.md" 2>/dev/null || echo "Spec no disponible")
          DIFF_STAT=$(git diff "main...${{ steps.spec.outputs.branch }}" --stat 2>/dev/null || echo "Sin diff disponible")
          TEST_OUTPUT=$(tail -n 200 /tmp/test-output.txt 2>/dev/null || echo "Sin output de tests")

          claude -p "
          Generá la descripción de un Pull Request en español para el proyecto Pulso IA.
          Usá formato markdown. Sé conciso (máximo 25 líneas).

          Incluí estas secciones:
          ## ¿Qué hace este PR?
          ## Archivos modificados
          ## Cómo testear localmente
          ## Estado de los tests

          SPEC ORIGINAL:
          $SPEC_CONTENT

          DIFF STAT:
          $DIFF_STAT

          OUTPUT DE TESTS:
          $TEST_OUTPUT
          " --max-turns 1 --output-format text > /tmp/pr-description.md

      # Usamos la REST API directamente: `gh pr create` en CI suele romperse (etiquetas, stderr, exit codes opacos).
      - name: Crear PR automático
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          OWNER="${{ github.repository_owner }}"
          BRANCH="${{ steps.spec.outputs.branch }}"
          TICKET="${{ steps.spec.outputs.ticket }}"
          API="${GITHUB_API_URL:-https://api.github.com}"
          AUTH=( -H "Authorization: Bearer ${GITHUB_TOKEN}"
                 -H "Accept: application/vnd.github+json"
                 -H "X-GitHub-Api-Version: 2022-11-28" )

          # Respuestas JSON de error pueden ser largas: buscamos señales de duplicado sin depender sólo del CLI.
          gh_pr_duplicate_message() {
            grep -qiE 'A pull request already exists|(pull.?request).{0,120}already|already.{0,40}exist|duplicate' "$1"

          }

          echo "Creando PR vía REST (sin gh CLI): repo=${REPO} branch=${BRANCH}"

          if [ ! -s /tmp/pr-description.md ]; then
            printf '%s\n\n%s\n\n%s\n\n%s\n' \
              "## ¿Qué hace este PR?" \
              "- Implementación generada desde el spec \`${TICKET}\`." \
              "---" \
              "_Descripción corta pendiente (Claude no generó archivo de cuerpo)._" \
              > /tmp/pr-description.md
          fi

          DEFAULT_BRANCH="$(curl -fsS "${AUTH[@]}" "${API}/repos/${REPO}" | jq -r '.default_branch // empty')"
          if [ -z "${DEFAULT_BRANCH}" ]; then
            DEFAULT_BRANCH="main"
            echo "::warning::No se pudo leer default_branch; usando 'main' como base."
          fi
          echo "Base del PR: ${DEFAULT_BRANCH}"

          # Etiquetas (best-effort; no bloquean el PR)
          curl -sS "${AUTH[@]}" -X POST "${API}/repos/${REPO}/labels" \
            -d '{"name":"ai-generated","color":"1D76DB","description":"Pipeline spec-executor"}' >/dev/null 2>&1 || true
          curl -sS "${AUTH[@]}" -X POST "${API}/repos/${REPO}/labels" \
            -d '{"name":"needs-review","color":"FBCA04","description":"Revisión humana"}' >/dev/null 2>&1 || true

          # ¿Ya hay PR abierto para esta cabeza? (filtro oficial: usuario|org:rama)
          OPEN_JSON="$(curl -fsS "${AUTH[@]}" -G "${API}/repos/${REPO}/pulls" \
            --data-urlencode "head=${OWNER}:${BRANCH}" \
            --data "state=open" \
            --data "per_page=5")"

          OPEN_N="$(echo "${OPEN_JSON}" | jq 'if type == "array" then length else 0 end')"
          if [ "${OPEN_N:-0}" -gt 0 ]; then
            EXISTING="$(echo "${OPEN_JSON}" | jq -r '.[0].html_url // empty')"
            echo "Ya existe un PR abierto para ${OWNER}:${BRANCH}: ${EXISTING}"
            exit 0
          fi

          PR_TITLE="feat(${TICKET}): implementación IA"
          PAYLOAD="$(jq -n \
            --arg title "${PR_TITLE}" \
            --arg head "${BRANCH}" \
            --arg base "${DEFAULT_BRANCH}" \
            --rawfile body /tmp/pr-description.md \
            '{title:$title, head:$head, base:$base, body:$body}')"

          set +e
          HTTP="$(curl -sS -w '%{http_code}' -o /tmp/gh-create-pr.json \
            "${AUTH[@]}" \
            -X POST "${API}/repos/${REPO}/pulls" \
            -d "${PAYLOAD}")"
          RC=$?
          set -euo pipefail

          if [ "${RC}" != 0 ]; then
            echo "::error::Fallo curl al crear PR (red o curl): código ${RC}"
            exit 1
          fi

          if [ "${HTTP}" = "201" ]; then
            PR_URL="$(jq -r '.html_url // empty' /tmp/gh-create-pr.json)"
            PR_NUM="$(jq -r '.number // empty' /tmp/gh-create-pr.json)"
            echo "PR creado: ${PR_URL}"

            # Etiquetas en la issue enlazada (best-effort)
            curl -sS "${AUTH[@]}" -X POST "${API}/repos/${REPO}/issues/${PR_NUM}/labels" \
              -d '{"labels":["ai-generated","needs-review"]}' >/dev/null 2>&1 \
              || echo "::notice::PR creado; no se aplicaron etiquetas (normal si falta scope o etiquetas)."
            exit 0
          fi

          cat /tmp/gh-create-pr.json
          echo "HTTP=${HTTP}"

          if [ "${HTTP}" = "422" ] && gh_pr_duplicate_message /tmp/gh-create-pr.json; then
            echo "GitHub informa que ya hay un PR o equivalente — no fallamos el job."
            exit 0
          fi

          # Fallback: algunas cuentas aceptan head como "owner:rama" cuando la rama es ambigua en orgs.
          if [ "${HTTP}" != "201" ]; then
            ALT="$(jq -n \
              --arg title "${PR_TITLE}" \
              --arg head "${OWNER}:${BRANCH}" \
              --arg base "${DEFAULT_BRANCH}" \
              --rawfile body /tmp/pr-description.md \
              '{title:$title, head:$head, base:$base, body:$body}')"

            set +e
            HTTP2="$(curl -sS -w '%{http_code}' -o /tmp/gh-create-pr-2.json \
              "${AUTH[@]}" \
              -X POST "${API}/repos/${REPO}/pulls" \
              -d "${ALT}")"
            set -euo pipefail

            if [ "${HTTP2}" = "201" ]; then
              echo "PR creado (head=${OWNER}:${BRANCH}): $(jq -r '.html_url' /tmp/gh-create-pr-2.json)"
              exit 0
            fi
            cat /tmp/gh-create-pr-2.json
            echo "HTTP2=${HTTP2}"
            if [ "${HTTP2}" = "422" ] && gh_pr_duplicate_message /tmp/gh-create-pr-2.json; then
              exit 0
            fi
          fi

          echo "::error::No se pudo crear el PR (HTTP=${HTTP}). Revisá el JSON anterior y permisos del GITHUB_TOKEN (Workflow permissions → Read and write)."
          exit 1

      - name: Resumen del run
        run: |
          echo "### ✅ Pipeline completado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Spec**: \`${{ steps.spec.outputs.file }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Movido a**: \`specs/done/${{ steps.spec.outputs.ticket }}.md\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Rama**: \`${{ steps.spec.outputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: creado automáticamente" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Output de tests" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -10 /tmp/test-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
